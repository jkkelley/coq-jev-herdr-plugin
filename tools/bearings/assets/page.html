<title>Bearings</title>
<!-- BREADCRUMB 2026-10-14 UTC. What broke: this page had no viewport meta, so an iPhone laid it out at 980 px and scaled it down; the safe-area
     insets in theme.css also read as 0 without viewport-fit=cover. Why it matters: the owner reads this page on an iPhone 16 Pro Max (430 CSS px).
     The skin (owner order 2026-10-14, theme.css breadcrumb) needs a 430 px layout to mean anything. color-scheme dark keeps form controls and
     scrollbars dark for both colour-scheme preferences. The font link swaps Figtree for Titillium Web (Factorio's face) plus IBM Plex Mono for ids;
     cost is one Google Fonts request, offline falls back along the stacks in theme.css. -->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#242324" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Titillium+Web:wght@400;600;700&display=swap"
/>
<style>
  @@THEME@@;
</style>

<nav class="top">
  <div class="bar">
    <span class="left"
      ><span class="brand">Stable</span
      ><span class="page" aria-current="page" id="page-title"
        >Decisions</span
      ></span
    ><span class="right"
      ><span id="navcount"></span
      ><span class="clock" id="clock" aria-label="Current time in UTC"
        >--:--:--Z</span
      ><span class="live" id="live"><i></i>Connecting</span></span
    >
  </div>
</nav>

<main>
  <header class="lede">
    <h1>Bearings.</h1>
    <p>One decision at a time. Pick, queue, next.</p>
  </header>

  <section class="bearings" aria-live="polite">
    <div class="bearing in" id="bearing"></div>
    <div class="segments" id="segments" aria-hidden="true"></div>
    <p class="sendline" id="sendline"></p>
    <div class="undo-row" id="undo-row" hidden></div>
  </section>

  <section class="composer" id="composer" aria-label="Message Claude">
    <div class="composer-head">
      <span class="label">Message Claude</span>
      <a href="#bearing" class="attn-link" id="attn-link" hidden
        ><i></i>New decision above</a
      >
    </div>
    <p class="idle-nudge" id="idle-nudge" hidden></p>
    <div class="thread-wrap">
      <div class="glow night" id="glow-night"></div>
      <div class="glow amber" id="glow-amber"></div>
      <div class="thread" id="thread"></div>
      <button
        class="jump"
        type="button"
        id="jump"
        aria-label="Jump to the latest message"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
        <span class="jump-badge" id="jump-badge" hidden></span>
      </button>
    </div>
    <div
      class="sr-only"
      id="live-announcer"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div class="attach-chip" id="attach-chip" hidden>
      <img class="attach-thumb" id="attach-thumb" alt="" hidden />
      <span class="attach-icon" id="attach-icon" aria-hidden="true" hidden
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 2v6h6" /></svg
      ></span>
      <span class="attach-info">
        <span class="attach-name" id="attach-name"></span>
        <span class="attach-size" id="attach-size"></span>
      </span>
      <button
        type="button"
        class="attach-x"
        id="attach-remove"
        aria-label="Remove attachment"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="compose">
      <textarea
        id="msg-text"
        rows="1"
        placeholder="Ask or tell Claude anything"
        aria-label="Message Claude"
      ></textarea>
      <button
        class="send"
        type="button"
        id="msg-send"
        aria-label="Send to Claude"
        disabled
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
    <div class="session-strip" id="session-strip" hidden>
      <!-- The fields are drawn from the SESSION_FIELDS array in the script (drawSession): one place to reorder or add. -->
      <div class="sess-fields" id="sess-fields"></div>
      <p class="session-hint" id="session-hint">
        <span
          >Busy? It waits in line and lands when the current step ends.</span
        >
        <span><kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</span>
      </p>
    </div>
  </section>

  <section class="band">
    <div class="inner">
      <h2>Where everything stands.</h2>
      <div id="list"></div>
    </div>
  </section>

  <footer>
    <span
      >Keys: <code>1</code>-<code>4</code> pick · <code>Enter</code> queue</span
    >
  </footer>
</main>

<script>
  // Polls /state every 2 seconds. Picks, typing, queued answers, and messages are kept in
  // localStorage until the server has them, so a hard refresh loses nothing.
  (() => {
    const $ = (id) => document.getElementById(id);
    const esc = (s) =>
      String(s ?? "").replace(
        /[&<>"]/g,
        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
      );
    const iso = () => new Date().toISOString();
    const store = {
      get: (k, fallback = {}) => {
        try {
          return JSON.parse(localStorage.getItem(`bearings:${k}`)) ?? fallback;
        } catch {
          return fallback;
        }
      },
      set: (k, v) => {
        try {
          localStorage.setItem(`bearings:${k}`, JSON.stringify(v));
        } catch {
          /* storage blocked: kept in memory */
        }
      },
    };
    const drafts = store.get("drafts");
    const outbox = store.get("outbox");
    const msgbox = store.get("msgbox");
    const askedAt = store.get("askedAt");
    const seenCards = store.get("seenCards");
    let lastLooked = store.get("lastLooked", 0) || Date.now();
    let state = {
      questions: { items: [] },
      error: null,
      session: null,
      answers: {},
      delivered: {},
      messages: [],
    };
    let seen = "";
    let at = -1;
    let reviewing = false;
    const UNDO_MS = 5000;
    const IDLE_MS = 15 * 60_000;

    // Relative age, quiet and short: "just now", "12 min ago", "2 hr 5 min ago".
    const relAge = (ms) => {
      const m = Math.max(0, Math.round((Date.now() - ms) / 60_000));
      if (m < 1) return "just now";
      if (m < 60) return `${m} min ago`;
      const h = Math.floor(m / 60);
      const rem = m % 60;
      return `${h} hr${rem ? ` ${rem} min` : ""} ago`;
    };

    const PAGE_BUILD = "@@BUILD@@";
    const tick = () => {
      $("clock").textContent = `${iso().slice(11, 19)}Z`;
      setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
    };
    tick();
    const live = (on) => {
      $("live").className = "live " + (on ? "on" : "off");
      $("live").replaceChildren(
        document.createElement("i"),
        document.createTextNode(on ? "Live" : "Offline"),
      );
    };
    const say = (text, warn) => {
      $("sendline").className = "sendline" + (warn ? " warn" : "");
      $("sendline").textContent = text;
    };

    const WORD = {
      waiting: "Waiting on you",
      queued: "Queued",
      sent: "Sent",
      received: "Received by Claude",
    };
    const items = () => state.questions?.items || [];
    const answerOf = (id) => outbox[id] || state.answers[id];
    const statusOf = (id) => {
      const a = answerOf(id);
      if (!a) return "waiting";
      if (outbox[id]) return "queued";
      return state.delivered[id] === a.at ? "received" : "sent";
    };
    const nextOpen = (from = 0) => {
      for (let i = from; i < items().length; i++)
        if (!answerOf(items()[i].id)) return i;
      return -1;
    };
    const typing = () =>
      document.activeElement?.matches?.("#bearing input[type='text']");

    // The asked-at stamp: the server's own "asked" wins, else the first time this browser
    // saw the id, recorded once and kept.
    const askedIso = (b) => {
      if (b.asked) return b.asked;
      if (!askedAt[b.id]) {
        askedAt[b.id] = iso();
        store.set("askedAt", askedAt);
      }
      return askedAt[b.id];
    };
    const askedLabel = (b) =>
      `Asked ${askedIso(b).slice(11, 16)}Z · ${relAge(Date.parse(askedIso(b)))}`;

    // BREADCRUMB 2026-10-14 UTC (Krastorio skin). What: an option gets the red "hold" button look in theme.css (.option.hold) when its card
    // says so (`tone: "hold"` or "destructive" on the option) or its label opens with a stop word. Why: the owner wants hold and destructive
    // choices red and the recommended one green at a glance, and an option carries no other signal. Rejected: matching the whole label or the
    // "then" text (too many false reds); the opening word only keeps it predictable. Cost: purely visual, the answer posted is unchanged.
    const HOLD_WORD =
      /^\s*(hold|stop|halt|pause|reject|decline|cancel|abort|revert|discard|delete|kill|drop|no)\b/i;
    const isHold = (o) =>
      o.tone === "hold" || o.tone === "destructive" || HOLD_WORD.test(o.label || "");

    const drawCard = () => {
      const card = $("bearing");
      if (state.error) {
        card.innerHTML = `<div class="facts"><span class="label">Error</span><span class="decide err">${esc(state.error)}</span></div>`;
        return;
      }
      const b = items()[at];
      if (!b) {
        card.innerHTML = `
          <div class="facts"><span class="label">Done</span><span class="decide">Nothing waiting on you.</span></div>
          ${items().length ? '<button class="btn link" type="button" id="review">Review answers</button>' : ""}`;
        return;
      }
      const a = answerOf(b.id);
      const d = drafts[b.id];
      const pick = d?.pick ?? a?.pick ?? b.rec ?? 0;
      const st = statusOf(b.id);
      card.innerHTML = `
        <div class="bearing-top">
          <div class="facts">
            <span class="label">About</span><span>${esc(b.about)}</span>
            <span class="label">Decide</span><span class="decide">${esc(b.decide)}</span>
          </div>
          <span class="asked" title="${esc(askedIso(b))}">${esc(askedLabel(b))}</span>
        </div>
        <div class="options" role="radiogroup" aria-label="${esc(b.decide)}">
          ${b.options
            .map(
              (o, i) => `
            <label class="option${isHold(o) ? " hold" : ""}" for="opt-${i}">
              <input type="radio" name="opt" id="opt-${i}" value="${i}" ${i === pick ? "checked" : ""} />
              <span class="text"><b>${esc(o.label)}</b><span>${esc(o.then)}</span></span>
              ${i === b.rec ? '<span class="badge">Rec</span>' : ""}
            </label>`,
            )
            .join("")}
        </div>
        <input type="text" class="own" id="own" placeholder="or answer in your own words..." aria-label="Answer in your own words" value="${esc(d?.words ?? a?.words ?? "")}" />
        <div class="actions">
          <button class="btn" type="button" id="queue-btn">Queue answer</button>
          <span class="chip ${st === "received" ? "" : "pending"}" ${st === "waiting" ? "hidden" : ""}>${WORD[st]}</span>
        </div>`;
    };

    // Thread, grouped like a phone: messages from one side within 3 minutes share a group with the
    // tail on the last one, a time stamp shows after a 10 minute gap, and your status shows once,
    // under your latest message. Typing dots show while Claude has your last message and has not
    // answered yet, for up to 10 minutes. Only unseen bubbles animate in. The thread is append-only:
    // existing bubbles are patched in place (class, meta, status) and new ones are appended, so a
    // text selection inside an old bubble survives a new arrival and the 2 second poll never flickers.
    const shown = new Set();
    const unread = new Set();
    const GROUP_MS = 3 * 60_000;
    const STAMP_MS = 10 * 60_000;
    const TYPING_MS = 10 * 60_000;
    const CHAT_WORD = {
      queued: "Sending",
      sent: "Delivered",
      received: "Read",
    };
    // 2.4/WK-20260916-066: the attachment a message carries never changes once sent, so it is
    // built once here and left alone by every later patch, same as the text itself already is.
    // An image mime (checked against the server's own inline allowlist, not guessed) gets a
    // small thumbnail linked to the full file; anything else gets a chip with its name.
    const INLINE_MIME_TYPES = new Set([
      "image/png",
      "image/jpeg",
      "image/gif",
      "image/webp",
    ]);
    const FILE_ICON_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
    const fileUrl = (id) => `file/${id}${location.search}`;
    const humanSize = (n) => {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(1)} MB`;
    };
    // WK-20260916-070: bubbleAttachEl's non-image branch carried only a filename, nothing telling
    // the owner what kind of file it was or how big, so the acceptance line calling for "enough of
    // the type and size for the owner to see what is attached" only held for the compose-time
    // preview chip, never for the one actually left in the thread. Most attachments are not images
    // (the brief's own point), so that bare-filename chip read as the squeezed-in fallback case it
    // was told not to be. Fixed by deriving a short label from the mime the upload response itself
    // reported (post R1/B2 correction, so a lying declared type never leaks into the label) rather
    // than adding a second name-to-label lookup table: a curated map is exactly the second
    // client-side list the brief says will drift from the server's, just for display text instead
    // of for the accept/reject decision. Cost: an unusual or vendor mime with no readable subtype
    // (e.g. "application/x-something-odd") shows that raw subtype rather than a polished word.
    const shortType = (mime) => {
      const sub = String(mime || "")
        .toLowerCase()
        .split("/")[1];
      if (!sub || sub === "octet-stream") return "File";
      const KNOWN = { plain: "Text", "x-zip-compressed": "Zip" };
      return KNOWN[sub] || sub.replace(/^x-/, "").toUpperCase();
    };
    const bubbleAttachEl = (f) => {
      const a = document.createElement("a");
      a.className = "bubble-attach";
      a.href = fileUrl(f.id);
      a.target = "_blank";
      a.rel = "noopener";
      if (INLINE_MIME_TYPES.has(f.mime)) {
        const img = document.createElement("img");
        img.className = "bubble-attach-img";
        img.src = fileUrl(f.id);
        img.alt = f.name || "Attached image";
        a.appendChild(img);
      } else {
        a.classList.add("chip-file");
        const icon = document.createElement("span");
        icon.innerHTML = FILE_ICON_SVG;
        const info = document.createElement("span");
        info.className = "bubble-attach-info";
        const name = document.createElement("span");
        name.className = "bubble-attach-name";
        name.textContent = f.name || "file";
        const meta = document.createElement("span");
        meta.className = "bubble-attach-meta";
        meta.textContent =
          typeof f.size === "number"
            ? `${shortType(f.mime)} · ${humanSize(f.size)}`
            : shortType(f.mime);
        info.append(name, meta);
        a.append(icon.firstChild, info);
      }
      return a;
    };
    const bubbleEl = (n) => {
      const el = document.createElement("div");
      el.dataset.key = n.key;
      el.className = n.cls;
      el.title = n.title;
      if (n.files?.[0]) el.appendChild(bubbleAttachEl(n.files[0]));
      if (n.text) {
        const text = document.createElement("span");
        text.className = "text";
        text.textContent = n.text;
        el.appendChild(text);
      }
      if (n.meta) {
        const meta = document.createElement("span");
        meta.className = "meta" + (n.metaGood ? " good" : "");
        meta.textContent = n.meta;
        el.appendChild(meta);
      }
      return el;
    };
    const patchBubble = (el, n) => {
      el.className = n.cls;
      el.title = n.title;
      if (n.files?.[0] && !el.querySelector(".bubble-attach"))
        el.insertBefore(bubbleAttachEl(n.files[0]), el.firstChild);
      let metaEl = el.querySelector(".meta");
      if (n.meta) {
        if (!metaEl) {
          metaEl = document.createElement("span");
          el.appendChild(metaEl);
        }
        metaEl.className = "meta" + (n.metaGood ? " good" : "");
        metaEl.textContent = n.meta;
      } else if (metaEl) {
        metaEl.remove();
      }
    };
    const stampEl = (n) => {
      const el = document.createElement("div");
      el.className = "stamp";
      el.dataset.key = n.key;
      el.textContent = n.text;
      return el;
    };
    const typingEl = () => {
      const el = document.createElement("div");
      el.className = "bubble claude head tail typing";
      el.dataset.key = "typing";
      el.setAttribute("role", "status");
      el.setAttribute("aria-label", "Claude has your message");
      const text = document.createElement("span");
      text.className = "text";
      text.append(
        document.createElement("i"),
        document.createElement("i"),
        document.createElement("i"),
      );
      el.appendChild(text);
      return el;
    };

    // ---- SITREP panel -------------------------------------------------------
    // A message whose text starts with SITREP_TAG carries a JSON briefing instead of prose.
    // It renders as a full width instrument panel in the thread, built node by node so every
    // string still lands as text and nothing in the payload can be markup. An unparseable
    // payload falls back to an ordinary bubble, which is the existing behaviour.
    const SITREP_TAG = "#SITREP/v1#";
    const sitrepData = (t) => {
      if (typeof t !== "string" || !t.startsWith(SITREP_TAG)) return null;
      try {
        const d = JSON.parse(t.slice(SITREP_TAG.length));
        return d && typeof d === "object" ? d : null;
      } catch {
        return null;
      }
    };
    const mk = (tag, cls, text) => {
      const el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text !== undefined && text !== null && text !== "")
        el.textContent = String(text);
      return el;
    };
    const srStat = (s) => {
      const c = mk("div", "sr-stat");
      c.append(mk("span", "sr-stat-label", s.label));
      const row = mk("div", "sr-stat-row");
      row.append(mk("span", "sr-stat-value", s.value));
      if (s.note) row.append(mk("span", "sr-stat-note " + (s.tone || "good"), s.note));
      c.append(row);
      return c;
    };
    // A link is a badge, never raw text, and its label is short. Only http and https are built:
    // anything else is dropped rather than rendered, because the payload is data and data does not
    // get to choose a scheme.
    const srShortUrl = (href) => {
      try {
        const u = new URL(href);
        const pr = u.pathname.match(/^\/([^/]+)\/([^/]+)\/pull\/(\d+)/);
        if (pr) return pr[2] + " #" + pr[3];
        const tail = u.pathname.replace(/\/$/, "").split("/").filter(Boolean).pop();
        return (u.hostname.replace(/^www\./, "") + (tail ? " / " + tail : "")).slice(0, 40);
      } catch {
        return String(href).slice(0, 40);
      }
    };
    const srLinks = (links) => {
      const row = mk("div", "sr-links");
      let n = 0;
      links.forEach((l) => {
        if (n >= 3 || !l || !l.href) return;
        let ok = false;
        try {
          const u = new URL(l.href);
          ok = u.protocol === "http:" || u.protocol === "https:";
        } catch {}
        if (!ok) return;
        n += 1;
        const a = document.createElement("a");
        a.className = "sr-link";
        a.href = l.href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = l.label || srShortUrl(l.href);
        a.title = l.href;
        row.append(a);
      });
      return n ? row : null;
    };
    const srRef = (id, title) => {
      // The reference sits under the sentence, never inside it. The owner's rule is that a ticket is
      // never named without its full title, and the sentence only stays short if the title is not in it.
      const r = mk("div", "sr-ref");
      r.append(mk("span", "sr-ref-id", id));
      if (title) r.append(mk("span", "sr-ref-title", title));
      return r;
    };
    const srItem = (it) => {
      const c = mk("div", "sr-item " + (it.tone === "bad" ? "bad" : ""));
      const head = mk("div", "sr-item-head");
      if (it.check) head.append(mk("span", "sr-check", "✓"));
      if (it.tone === "bad") head.append(mk("span", "sr-dot", ""));
      head.append(mk("span", "sr-item-label " + (it.tone || ""), it.label));
      c.append(head, mk("p", "sr-item-text", it.text));
      if (it.ref) c.append(srRef(it.ref, it.ref_title));
      if (Array.isArray(it.links) && it.links.length) {
        const row = srLinks(it.links);
        if (row) c.append(row);
      }
      return c;
    };
    const srQueue = (q) => {
      const c = mk("div", "sr-q");
      const top = mk("div", "sr-q-top");
      top.append(mk("span", "sr-q-name", q.name));
      const nums = mk("span", "sr-q-nums");
      nums.append(mk("span", "sr-q-count", q.count));
      if (q.delta) nums.append(mk("span", "sr-q-delta " + (q.tone || ""), q.delta));
      top.append(nums);
      c.append(top);
      if (q.urgency) c.append(mk("span", "sr-badge " + (q.tone || ""), q.urgency));
      // next_items is the structured form; next stays as plain strings so a tab running an older
      // renderer shows the same information as text instead of [object Object].
      const entries = Array.isArray(q.next_items) && q.next_items.length ? q.next_items : q.next;
      if (Array.isArray(entries) && entries.length) {
        const list = mk("ul", "sr-q-next");
        entries.slice(0, 5).forEach((n) => {
          const li = mk("li", "");
          if (n && typeof n === "object") {
            li.append(mk("span", "sr-n-id", n.id));
            if (n.title) li.append(mk("span", "sr-n-title", n.title));
          } else {
            li.textContent = String(n);
          }
          list.append(li);
        });
        c.append(list);
      }
      return c;
    };
    const sitrepEl = (n) => {
      const d = n.data;
      const el = mk("div", "sitrep" + (n.fresh ? " new" : ""));
      el.dataset.key = n.key;
      const head = mk("div", "sr-head");
      head.append(mk("span", "sr-mark", "⚡"), mk("span", "sr-title", "SITREP"));
      head.append(mk("span", "sr-slash", "//"));
      if (d.scope) head.append(mk("span", "sr-scope", d.scope));
      if (d.state_label) {
        const pill = mk("span", "sr-pill " + (d.state || "nominal"));
        pill.append(mk("i", "sr-ping", ""), mk("span", "", d.state_label));
        head.append(pill);
      }
      el.append(head);
      if (d.updated) el.append(mk("div", "sr-updated", "UPDATED " + d.updated));
      if (Array.isArray(d.stats) && d.stats.length) {
        const g = mk("div", "sr-stats");
        d.stats.slice(0, 4).forEach((s) => g.append(srStat(s)));
        el.append(g);
      }
      (Array.isArray(d.blocks) ? d.blocks : []).forEach((b) => {
        const sec = mk("section", "sr-block");
        const h = mk("div", "sr-block-head");
        h.append(mk("span", "sr-block-n", b.n), mk("span", "sr-block-name", b.name));
        sec.append(h);
        if (Array.isArray(b.queues) && b.queues.length) {
          const g = mk("div", "sr-qs");
          b.queues.forEach((q) => g.append(srQueue(q)));
          sec.append(g);
        }
        (Array.isArray(b.items) ? b.items : []).slice(0, 2).forEach((it) =>
          sec.append(srItem(it)),
        );
        el.append(sec);
      });
      return el;
    };
    const drawThread = () => {
      const server = state.messages || [];
      const known = new Set(server.map((m) => m.id));
      const all = [
        ...server.map((m) => ({
          ...m,
          st: state.delivered[m.id] === m.at ? "received" : "sent",
        })),
        ...Object.values(msgbox)
          .filter((m) => !known.has(m.id))
          .map((m) => ({ ...m, st: "queued" })),
      ]
        .sort((x, y) => x.at.localeCompare(y.at))
        .slice(-50);
      const side = (m) => (m.from === "claude" ? "claude" : "you");
      const time = (m) => Date.parse(m.at);
      const lastMine = [...all].reverse().find((m) => side(m) === "you");
      const last = all[all.length - 1];
      const typingNow =
        last &&
        side(last) === "you" &&
        last.st === "received" &&
        Date.now() - time(last) < TYPING_MS;
      const nodes = [];
      all.forEach((m, i) => {
        const prev = all[i - 1];
        const next = all[i + 1];
        if (!prev || time(m) - time(prev) > STAMP_MS)
          nodes.push({
            kind: "stamp",
            key: `stamp:${m.id}`,
            text: `${m.at.slice(11, 16)}Z`,
          });
        const head =
          !prev || side(prev) !== side(m) || time(m) - time(prev) > GROUP_MS;
        const tail =
          !next || side(next) !== side(m) || time(next) - time(m) > GROUP_MS;
        const cls = [
          "bubble",
          side(m),
          m.st,
          head && "head",
          tail && "tail",
          !shown.has(m.id) && "new",
        ]
          .filter(Boolean)
          .join(" ");
        const sr = side(m) === "claude" ? sitrepData(m.text) : null;
        nodes.push(
          sr
            ? {
                kind: "sitrep",
                key: m.id,
                data: sr,
                fresh: !shown.has(m.id),
              }
            : {
                kind: "bubble",
                key: m.id,
                cls,
                title: `${m.at.slice(11, 16)}Z`,
                text: m.text,
                files: m.files || null,
                meta: m === lastMine ? CHAT_WORD[m.st] : "",
                metaGood: m.st === "received",
              },
        );
      });
      if (typingNow) nodes.push({ kind: "typing", key: "typing" });
      // Stay pinned to the newest message unless the user scrolled up to read; their own new
      // message always brings the window down.
      const box = $("thread");
      const pinned = box.scrollHeight - box.scrollTop - box.clientHeight < 48;
      const wasEmpty = !box.childElementCount;
      const mine = all.some((m) => !shown.has(m.id) && side(m) === "you");
      const newClaude = all.filter(
        (m) => side(m) === "claude" && !shown.has(m.id),
      );
      // Diff by key: patch matched bubbles in place, drop the old tail past the first
      // mismatch (only happens once the 50-message cap trims the oldest), append the rest.
      const oldEls = Array.from(box.children);
      let i = 0;
      while (
        i < oldEls.length &&
        i < nodes.length &&
        oldEls[i].dataset.key === nodes[i].key
      ) {
        if (nodes[i].kind === "bubble") patchBubble(oldEls[i], nodes[i]);
        i++;
      }
      for (const el of oldEls.slice(i)) el.remove();
      for (; i < nodes.length; i++) {
        const n = nodes[i];
        box.appendChild(
          n.kind === "stamp"
            ? stampEl(n)
            : n.kind === "typing"
              ? typingEl()
              : n.kind === "sitrep"
                ? sitrepEl(n)
                : bubbleEl(n),
        );
      }
      all.forEach((m) => shown.add(m.id));
      if (pinned || mine || wasEmpty) {
        const pinLatest = () => {
          box.scrollTop = box.scrollHeight;
        };
        if (wasEmpty) {
          pinLatest();
          requestAnimationFrame(() => {
            pinLatest();
            requestAnimationFrame(pinLatest);
          });
          document.fonts?.ready.then(pinLatest);
        } else {
          box.scrollTo({ top: box.scrollHeight, behavior: "smooth" });
        }
      }
      if (newClaude.length) {
        if (!pinned || document.hidden)
          newClaude.forEach((m) => unread.add(m.id));
        // A SITREP message is a JSON payload; a screen reader gets its label, not the braces.
        $("live-announcer").textContent = newClaude
          .map((m) => (sitrepData(m.text) ? "SITREP received" : m.text))
          .join(" ");
      }
      updateJumpBadge();
      renderTitle();
    };

    const drawRest = () => {
      $("page-title").textContent = state.questions?.title || "Decisions";
      $("segments").innerHTML = items()
        .map(
          (b, i) =>
            `<i class="${answerOf(b.id) ? "done" : ""} ${i === at ? "active" : ""}"></i>`,
        )
        .join("");
      const left = items().filter((b) => !answerOf(b.id)).length;
      $("navcount").textContent = left ? `${left} waiting` : "All answered";
      $("list").innerHTML = [...items()]
        .reverse()
        .map((b) => {
          const st = statusOf(b.id);
          const a = answerOf(b.id);
          const word = a
            ? `${a.choice}${a.words ? " + note" : ""} · ${WORD[st]}`
            : WORD[st];
          const cls = { waiting: "active", received: "good" }[st] || "";
          return `<div class="item" data-id="${esc(b.id)}"><div><span class="k">${esc(b.id)}</span>${esc(b.decide)}</div><span class="state ${cls}">${esc(word)}</span></div>`;
        })
        .join("");
      const answered = items().filter((b) => answerOf(b.id));
      if (Object.keys(outbox).length) say("Queued. Sending.");
      else if (answered.some((b) => statusOf(b.id) === "sent"))
        say("Sent. Waiting for Claude.");
      else if (answered.length) say("Claude received every answer.");
      else say("");
      drawThread();
      drawSession();
      checkAttention();
      idleLine();
      drawUndo();
      renderTitle();
    };

    // Tab title and the jump button's unread pill: armed while a Claude reply lands off screen
    // or the tab is hidden, cleared the moment the thread is back at the bottom and visible.
    let idleWaitingCount = 0;
    const renderTitle = () => {
      const base = state.questions?.title || "Bearings";
      const n = idleWaitingCount || (document.hidden ? unread.size : 0);
      document.title = n ? `(${n}) ${base}` : base;
    };
    const atBottom = () => {
      const box = $("thread");
      return box.scrollHeight - box.scrollTop - box.clientHeight < 4;
    };
    const updateJumpBadge = () => {
      const badge = $("jump-badge");
      if (unread.size) {
        badge.hidden = false;
        badge.textContent = unread.size > 9 ? "9+" : String(unread.size);
      } else {
        badge.hidden = true;
      }
    };
    const clearUnread = () => {
      if (!unread.size) return;
      unread.clear();
      updateJumpBadge();
      renderTitle();
    };

    // Session strip: session.json as the server's session sync keeps it (scripts/lib/session-sync.mjs), redrawn on every state
    // change from the 2 second poll and by a 10 second ticker so the relative times move.
    //
    // BREADCRUMB 2026-10-14 UTC (owner: "none of this shit gets updated automatically").
    // What broke: the strip itself already redrew on the poll; the data under it was written once at server start, so it
    // looked live and showed a four-day-old model, ticket and start time, with FROM empty. The fix is the sync (data layer);
    // this block makes the stale case visible instead of trusting the file: a STALE pill when session.json says stale, when
    // last_active is older than sync.stale_minutes (default 10).
    // Layout: unchanged from the vendored strip (Model, From, Session, Since, Working on) plus Ticket beside Working on and a
    // watcher dot beside Since, per the architect's correction. SESSION_FIELDS is the one array to edit to reorder or add:
    // each entry is { label, wide?, mono?, cells(ctx) -> { text, title?, tone?, sub?, dot? } }. Rejected: hardcoded markup
    // per field (the original), where adding one meant HTML, an id and a line in drawSession.
    const shortCwd = (p) =>
      String(p || "").replace(
        /^(\/home\/[^/]+|\/Users\/[^/]+|\/root)(?=\/|$)/,
        "~",
      );
    const sinceLabel = (startedIso) =>
      `${startedIso.slice(11, 16)}Z · ${relAge(Date.parse(startedIso))}`;
    const tokLabel = (n) => (n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
    const SESSION_FIELDS = [
      {
        label: "Model",
        f: ({ s }) => ({
          text: s.model || "–",
          sub:
            s.context_pct != null
              ? `context ${s.context_pct}%`
              : s.context_tokens != null
                ? `context ${tokLabel(s.context_tokens)} tokens, window n/a`
                : "context n/a",
        }),
      },
      {
        label: "From",
        mono: true,
        f: ({ s }) => {
          const p = s.from;
          if (!p && !s.cwd) return { text: "–" };
          return {
            text: p ? `${p.label || "pane"} · ${p.pane_id}` : shortCwd(s.cwd),
            title: s.cwd || "",
            sub: p ? shortCwd(s.cwd) : "herdr pane n/a",
          };
        },
      },
      {
        label: "Session",
        mono: true,
        f: ({ s }) => ({ text: (s.session || "").slice(0, 8), title: s.session || "" }),
      },
      {
        label: "Since",
        f: ({ s, w, stale }) => ({
          text: s.started ? sinceLabel(s.started) : "–",
          sub: s.last_active ? `active ${relAge(Date.parse(s.last_active))}` : "",
          tone: stale ? "bad" : "",
          dot: w
            ? {
                on: !!w.alive,
                text: w.alive ? `watcher ${w.pane_id || "up"}` : "no watcher",
                title: w.alive
                  ? `wait loop alive, pid ${w.pid}, pane ${w.pane_id || "unknown"}`
                  : "no wait loop is running for this page",
              }
            : null,
        }),
      },
      {
        label: "Ticket",
        mono: true,
        // BREADCRUMB 2026-10-14 UTC (session-sync.mjs, same date): only a WO- id is a ticket; main or any other branch is
        // shown as a muted "none" with the branch kept in the tooltip. The test also covers a session.json written by an older
        // sync (stable keeps running the old server.mjs until restart) whose ticket is still the bare branch.
        f: ({ s }) =>
          /^WO-\d{8}-[0-9a-f]{4}$/.test(s.ticket || "")
            ? { text: s.ticket, title: s.branch || "", sub: s.ticket_title || "" }
            : { text: "none", tone: "muted", title: s.branch || "" },
      },
      {
        label: "Working on",
        wide: true,
        // Empty is shown as a muted "not set", never as a branch name (BREADCRUMB 2026-10-14 UTC, session-sync.mjs: a branch is
        // a place, not a task; TICKET already carries it).
        f: ({ s }) => (s.working_on ? { text: s.working_on } : { text: "not set", tone: "muted" }),
      },
    ];
    const staleReason = (s) => {
      const lim = (state.sync?.stale_minutes ?? 10) * 60_000;
      if (s.stale) return "the seat's transcript could not be read";
      if (s.last_active && Date.now() - Date.parse(s.last_active) > lim)
        return `no activity for ${Math.round((Date.now() - Date.parse(s.last_active)) / 60_000)} min`;
      return "";
    };
    const drawSession = () => {
      const s = state.session;
      const strip = $("session-strip");
      if (!s) {
        strip.hidden = true;
        return;
      }
      strip.hidden = false;
      const why = staleReason(s);
      const box = $("sess-fields");
      box.textContent = "";
      const ctx = { s, w: state.watcher, stale: !!why };
      for (const fd of SESSION_FIELDS) {
        const c = fd.f(ctx);
        const el = mk("div", "field" + (fd.wide ? " wide" : ""));
        el.append(mk("span", "label", fd.label));
        const v = mk("span", "value" + (fd.mono ? " mono" : "") + (c.tone ? " " + c.tone : ""), c.text);
        if (c.title) v.title = c.title;
        let dot = null;
        if (c.dot) {
          const d = mk("span", "watch " + (c.dot.on ? "on" : "off"));
          d.append(mk("i", ""), document.createTextNode(c.dot.text));
          d.title = c.dot.title;
          dot = d;
        }
        el.append(v);
        if (c.sub) el.append(mk("span", "sub", c.sub));
        if (dot) el.append(dot);
        box.append(el);
      }
      if (why) {
        const pill = mk("span", "stale-pill", "STALE");
        pill.title = why;
        box.append(pill);
      }
    };

    // Attention glow: the first time an unanswered card's id is seen, the composer warms from
    // night to amber until any answer is queued.
    const setAttention = (on) => {
      $("composer").classList.toggle("attention", on);
      $("attn-link").hidden = !on;
    };
    const checkAttention = () => {
      let fresh = false;
      let changed = false;
      for (const b of items()) {
        if (seenCards[b.id]) continue;
        seenCards[b.id] = true;
        changed = true;
        if (!answerOf(b.id)) fresh = true;
      }
      if (changed) store.set("seenCards", seenCards);
      if (fresh) setAttention(true);
    };

    // Idle nudge: a quiet line once 15 minutes pass with unanswered cards and no look.
    const markLooked = () => {
      lastLooked = Date.now();
      store.set("lastLooked", lastLooked);
    };
    const idleLine = () => {
      const el = $("idle-nudge");
      const left = items().filter((b) => !answerOf(b.id)).length;
      const idleFor = Date.now() - lastLooked;
      if (!left || idleFor < IDLE_MS) {
        el.hidden = true;
        idleWaitingCount = 0;
        return;
      }
      const mins = Math.floor(idleFor / 60_000);
      el.hidden = false;
      el.textContent = `${left} decision${left === 1 ? "" : "s"} waiting · ${mins} min`;
      idleWaitingCount = left;
    };

    // Undo: the answer sits in the outbox only, unposted, until UNDO_MS passes.
    const pendingUndo = () => {
      const ids = Object.keys(outbox);
      if (!ids.length) return null;
      const id = ids.sort((x, y) =>
        outbox[y].at.localeCompare(outbox[x].at),
      )[0];
      const a = outbox[id];
      const deadline = Date.parse(a.at) + UNDO_MS;
      return deadline > Date.now() ? { id, a, deadline } : null;
    };
    let undoShownFor = null;
    let undoTicker = null;
    const drawUndo = () => {
      const p = pendingUndo();
      const row = $("undo-row");
      if (!p) {
        if (undoShownFor !== null) {
          row.hidden = true;
          row.innerHTML = "";
          undoShownFor = null;
          if (undoTicker) {
            clearInterval(undoTicker);
            undoTicker = null;
          }
        }
        return;
      }
      // Only (re)build the row when the pending id changes, so the CSS-driven ring is never
      // restarted by an unrelated poll.
      if (undoShownFor === p.id) return;
      undoShownFor = p.id;
      row.hidden = false;
      const remain = p.deadline - Date.now();
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      row.innerHTML = `
        <span class="chip pending">Queued</span>
        <button class="undo" type="button" id="undo-btn">
          ${
            reduced
              ? `<span class="count">${Math.ceil(remain / 1000)}</span>`
              : `<svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="ring-bg" cx="10" cy="10" r="8.5" /><circle class="ring-fg" cx="10" cy="10" r="8.5" style="animation-delay:-${UNDO_MS - remain}ms" /></svg>`
          }
          <span>Undo</span>
        </button>`;
      $("undo-btn").addEventListener("click", () => undoAnswer(p.id));
      if (reduced)
        undoTicker = setInterval(() => {
          const still = pendingUndo();
          const count = row.querySelector(".count");
          if (!still || !count) return;
          count.textContent = Math.max(
            0,
            Math.ceil((still.deadline - Date.now()) / 1000),
          );
        }, 250);
    };
    const undoAnswer = (id) => {
      const a = outbox[id];
      if (!a) return;
      delete outbox[id];
      store.set("outbox", outbox);
      drafts[id] = { pick: a.pick, words: a.words };
      store.set("drafts", drafts);
      undoShownFor = null;
      drawUndo();
      const idx = items().findIndex((it) => it.id === id);
      if (idx >= 0) goTo(idx);
      drawRest();
    };

    // Card hopping: jump straight to any card, in any order, with the same rise motion.
    const goTo = (idx) => {
      if (idx < 0 || idx >= items().length) return;
      at = idx;
      reviewing = true;
      const card = $("bearing");
      card.classList.remove("in");
      void card.offsetWidth;
      card.classList.add("in");
      drawCard();
      drawRest();
    };

    const saveDraft = () => {
      const b = items()[at];
      if (!b) return;
      const picked = document.querySelector(
        "#bearing input[type='radio']:checked",
      );
      drafts[b.id] = {
        pick: picked ? Number(picked.value) : b.rec,
        words: $("own")?.value ?? "",
      };
      store.set("drafts", drafts);
    };
    $("bearing").addEventListener("input", saveDraft);
    $("bearing").addEventListener("change", saveDraft);

    // Composer: the draft is saved on every keystroke; the field grows with its text.
    const msg = $("msg-text");
    const fit = () => {
      if (CSS.supports("field-sizing", "content")) return;
      msg.style.height = "auto";
      msg.style.height = `${Math.min(msg.scrollHeight, 220)}px`;
    };
    const syncSend = () =>
      ($("msg-send").disabled = !msg.value.trim() && !pendingAttachment);
    msg.value = store.get("msgdraft", "");
    fit();
    msg.addEventListener("input", () => {
      store.set("msgdraft", msg.value);
      fit();
      syncSend();
    });

    // 2.4/WK-20260916-066: paste or drop, image or any other file, uploads ahead of the message
    // text it rides in with; the chip shows what is about to send. One attachment per message
    // this round (a scope call, not a limit of the storage: files.jsonl and a message's own
    // files array are both already plural). FILE_MAX_BYTES mirrors server.mjs's own cap so an
    // oversized paste is refused before a byte leaves the browser.
    const FILE_MAX_BYTES = 25 * 1024 * 1024;
    let pendingAttachment = null;
    let attachUploadId = null;
    let attachObjectUrl = null;
    const setAttachPreview = (kind) => {
      $("attach-thumb").hidden = kind !== "image";
      $("attach-icon").hidden = kind !== "file";
    };
    const clearAttachment = () => {
      pendingAttachment = null;
      attachUploadId = null;
      $("attach-chip").hidden = true;
      $("attach-chip").classList.remove("error");
      if (attachObjectUrl) URL.revokeObjectURL(attachObjectUrl);
      attachObjectUrl = null;
      $("attach-thumb").removeAttribute("src");
      $("attach-name").textContent = "";
      $("attach-size").textContent = "";
      syncSend();
    };
    const showAttachError = (text) => {
      $("attach-chip").hidden = false;
      $("attach-chip").classList.add("error");
      $("attach-name").textContent = text;
      $("attach-size").textContent = "";
      setAttachPreview("none");
      setTimeout(clearAttachment, 2000);
    };
    const uploadAttachment = async (blob, rawName) => {
      if (!blob.size) return showAttachError("Empty file");
      if (blob.size > FILE_MAX_BYTES) return showAttachError("File over 25 MB");
      const thisUpload = Symbol();
      attachUploadId = thisUpload;
      $("attach-chip").hidden = false;
      $("attach-chip").classList.remove("error");
      $("attach-name").textContent = "Uploading…";
      $("attach-size").textContent = "";
      if (attachObjectUrl) URL.revokeObjectURL(attachObjectUrl);
      attachObjectUrl = null;
      // An instant local preview from what the browser claims the type is; replaced below by
      // whatever the server actually decides once the upload response names the real type.
      if (INLINE_MIME_TYPES.has(blob.type)) {
        attachObjectUrl = URL.createObjectURL(blob);
        $("attach-thumb").src = attachObjectUrl;
        setAttachPreview("image");
      } else {
        setAttachPreview("file");
      }
      try {
        const r = await fetch(`file${location.search}`, {
          method: "POST",
          headers: {
            "content-type": blob.type || "application/octet-stream",
            "x-file-name": encodeURIComponent(rawName || "file"),
          },
          body: blob,
        });
        if (attachUploadId !== thisUpload) return; // removed or replaced meanwhile
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          return showAttachError(
            r.status === 413 ? "File too large" : body.error || "Upload failed",
          );
        }
        const out = await r.json();
        if (attachUploadId !== thisUpload) return;
        pendingAttachment = {
          id: out.id,
          name: out.name,
          mime: out.mime,
          size: out.size,
        };
        $("attach-name").textContent = out.name;
        $("attach-size").textContent = humanSize(out.size);
        // R1/B2: the server may have corrected a lying declared type; its answer wins over the
        // instant local preview above.
        if (INLINE_MIME_TYPES.has(out.mime)) {
          setAttachPreview("image");
        } else {
          if (attachObjectUrl) URL.revokeObjectURL(attachObjectUrl);
          attachObjectUrl = null;
          setAttachPreview("file");
        }
        syncSend();
      } catch {
        if (attachUploadId === thisUpload) showAttachError("Upload failed");
      }
    };
    const fileFromClipboardOrDrop = (dt) => {
      for (const item of dt?.items || []) {
        if (item.kind === "file") return item.getAsFile();
      }
      return dt?.files?.[0] || null;
    };
    msg.addEventListener("paste", (e) => {
      const f = fileFromClipboardOrDrop(e.clipboardData);
      if (!f) return;
      e.preventDefault();
      uploadAttachment(f, f.name);
    });
    $("composer").addEventListener("dragover", (e) => e.preventDefault());
    $("composer").addEventListener("drop", (e) => {
      const f = fileFromClipboardOrDrop(e.dataTransfer);
      if (!f) return;
      e.preventDefault();
      uploadAttachment(f, f.name);
    });
    $("attach-remove").addEventListener("click", clearAttachment);
    syncSend();

    const post = async (path, body) => {
      const r = await fetch(path + location.search, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    };
    const flush = async () => {
      try {
        for (const [id, a] of Object.entries(outbox)) {
          // Held back until its undo window has run out.
          if (Date.now() < Date.parse(a.at) + UNDO_MS) continue;
          await post("answer", { id, pick: a.pick, words: a.words, at: a.at });
          delete outbox[id];
          store.set("outbox", outbox);
        }
        for (const m of Object.values(msgbox)) {
          const saved = await post("message", m);
          state.messages = [
            ...(state.messages || []).filter((x) => x.id !== saved.id),
            saved,
          ];
          delete msgbox[m.id];
          store.set("msgbox", msgbox);
        }
      } catch {
        say("Not sent yet. Saved on this device; retrying.", true);
      }
    };

    const poll = async () => {
      try {
        await flush();
        const r = await fetch("state" + location.search, { cache: "no-store" });
        if (!r.ok) throw new Error(String(r.status));
        const s = await r.json();
        live(true);
        const text = JSON.stringify(s);
        if (text !== seen) {
          const newQuestions =
            JSON.stringify(s.questions) !== JSON.stringify(state.questions);
          // A renderer newer than this tab is running: take it once, then carry on.
          if (s.build && s.build !== PAGE_BUILD) {
            const once = "bearings-build-" + s.build;
            try {
              if (!sessionStorage.getItem(once)) {
                sessionStorage.setItem(once, "1");
                location.reload();
                return;
              }
            } catch {}
          }
          seen = text;
          state = s;
          if (at < 0 || newQuestions)
            at = nextOpen() < 0 ? items().length : nextOpen();
          if (!typing()) drawCard();
          drawRest();
        }
      } catch {
        live(false);
      }
      setTimeout(poll, 2000);
    };

    const queueAnswer = () => {
      const b = items()[at];
      if (!b) return;
      const picked = document.querySelector(
        "#bearing input[type='radio']:checked",
      );
      const pick = picked ? Number(picked.value) : b.rec;
      outbox[b.id] = {
        pick,
        choice: b.options[pick].label,
        words: $("own").value.trim(),
        at: iso(),
      };
      store.set("outbox", outbox);
      delete drafts[b.id];
      store.set("drafts", drafts);
      markLooked();
      setAttention(false);
      let next = nextOpen(at + 1);
      if (next < 0) next = nextOpen();
      if (next < 0)
        next = reviewing && at + 1 < items().length ? at + 1 : items().length;
      at = next;
      const card = $("bearing");
      card.classList.remove("in");
      void card.offsetWidth;
      card.classList.add("in");
      drawCard();
      drawRest();
      flush().then(drawRest);
    };

    const sendMessage = () => {
      const text = msg.value.trim();
      if (!text && !pendingAttachment) return;
      const now = iso();
      const id = `m-${now.replace(/[^0-9]/g, "")}-${Math.random().toString(36).slice(2, 7)}`;
      msgbox[id] = {
        id,
        text,
        at: now,
        ...(pendingAttachment ? { files: [pendingAttachment] } : {}),
      };
      store.set("msgbox", msgbox);
      msg.value = "";
      store.set("msgdraft", "");
      clearAttachment();
      fit();
      syncSend();
      drawThread();
      msg.focus();
      flush().then(drawRest);
    };
    $("msg-send").addEventListener("click", sendMessage);
    msg.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || e.shiftKey) return;
      e.preventDefault();
      sendMessage();
    });

    $("bearing").addEventListener("click", (e) => {
      if (e.target.id === "queue-btn") queueAnswer();
      if (e.target.id === "review") {
        reviewing = true;
        at = 0;
        drawCard();
        drawRest();
      }
    });
    // Card hopping: every segment and every row in "Where everything stands" jumps straight
    // to that card.
    $("segments").addEventListener("click", (e) => {
      const idx = Array.from($("segments").children).indexOf(e.target);
      if (idx >= 0) goTo(idx);
    });
    $("list").addEventListener("click", (e) => {
      const row = e.target.closest(".item");
      if (!row) return;
      goTo(items().findIndex((b) => b.id === row.dataset.id));
    });
    $("attn-link").addEventListener("click", (e) => {
      e.preventDefault();
      $("bearing").scrollIntoView({
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "auto"
          : "smooth",
        block: "center",
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.closest?.("#composer")) return;
      const b = items()[at];
      if (!b || e.metaKey || e.ctrlKey || e.altKey) return;
      if (typing()) {
        if (e.key === "Enter") queueAnswer();
        return;
      }
      if (e.key === "ArrowLeft") return goTo(at - 1);
      if (e.key === "ArrowRight") return goTo(at + 1);
      const n = Number(e.key);
      if (n >= 1 && n <= b.options.length) {
        $(`opt-${n - 1}`).checked = true;
        saveDraft();
      }
      if (e.key === "Enter" && !e.target.matches("button")) queueAnswer();
    });

    // Jump to latest: shows once the user is more than a screenful of chat away from the newest
    // message, and eases back down in about a quarter second. Reaching the bottom also clears
    // the unread pill and, once the tab is visible again too, the title prefix.
    const jumpBox = $("thread");
    const syncJump = () => {
      $("jump").classList.toggle(
        "show",
        jumpBox.scrollHeight - jumpBox.scrollTop - jumpBox.clientHeight > 120,
      );
      if (atBottom()) clearUnread();
    };
    jumpBox.addEventListener("scroll", syncJump, { passive: true });

    $("jump").addEventListener("click", () => {
      const from = jumpBox.scrollTop;
      const to = jumpBox.scrollHeight - jumpBox.clientHeight;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches)
        return (jumpBox.scrollTop = to);
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / 260);
        jumpBox.scrollTop = from + (to - from) * (1 - Math.pow(1 - t, 3));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });

    document.addEventListener("visibilitychange", () => {
      renderTitle();
      if (!document.hidden && atBottom()) clearUnread();
    });

    // Idle nudge: a look counts whether it lands from answering or from the card itself
    // scrolling at least half into view.
    new IntersectionObserver(
      (entries) => entries[0].isIntersecting && markLooked(),
      {
        threshold: 0.5,
      },
    ).observe($("bearing"));

    // Relative-age labels (asked-at, session since, idle minutes) and the undo ring's window
    // are time-based, not state-based, so they get their own tickers alongside the 2 second poll.
    // Only the small label text is touched, never the card itself, so an open pick or a draft
    // in progress is never disturbed.
    setInterval(drawUndo, 250);
    setInterval(drawSession, 10_000);
    setInterval(() => {
      const b = items()[at];
      const askedEl = b && $("bearing").querySelector(".asked");
      if (askedEl) askedEl.textContent = askedLabel(b);
      drawSession();
      idleLine();
      renderTitle();
    }, 60_000);

    drawThread();
    poll();
  })();
</script>
